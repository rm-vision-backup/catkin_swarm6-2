# 11 架 2×3 编队任务参数源（2026-10-21）。
# 任务坐标：右 x / 前 y / 上 z；原点=标定排中心（第 1 排 UAV8）。
# 地面列：x=-10,-5,0,+5,+10；行：y=+5,0,-5。

schema_version: "1.0"

grid:
  columns_m: [-10.0, -5.0, 0.0, 5.0, 10.0]
  row_y_m: [5.0, 0.0, -5.0]
  row_uavs:
    - [UAV6, UAV8, UAV9]
    - [UAV10, UAV11, UAV12]
    - [UAV13, UAV14, UAV15, UAV16, UAV2]
  absent_uavs: [UAV1, UAV3, UAV4, UAV5, UAV7]

field:
  min_x: -50.0
  max_x: 50.0
  min_y: -15.0
  max_y: 140.0
  safety_margin_m: 5.0

mission:
  custom_roles: true
  formation_uavs: [UAV6, UAV8, UAV9, UAV10, UAV11, UAV12]
  leader_uav: UAV6
  faulted_uavs: [UAV10, UAV11]
  spare_uavs: [UAV13, UAV14]        # 与 faulted_uavs 按索引对应
  fault_exit_side: left
  fault_exit_alt_m: 8.0
  fault_exit_dx_m: 30.0
  fault_exit_dy_m: 0.0
  fault_exit_clearance_y_m: 0.0
  formation_block: custom
  prepare_forward_m: 1.0
  spare_hold_alt_m: 5.0
  segment_length_m: 60.0
  coverage_strips: 3
  coverage_lateral_step_m: 12.0
  scan_band_m: 8.0
  coverage_alt_m: 12.0
  b_transit_alt_m: 8.0
  b_strike_alt_m: 5.0
  b_start_alt_m: 5.0
  b_count: 3
  b_strike_count: 2
  b_uavs: [UAV15, UAV16, UAV2]
  b_strike_uavs: [UAV15, UAV16]     # 保持顺序，不能按编号排序
  b_reserve_uav: UAV2
  b_failed_uav: UAV15
  b_failed_index: 0
  b_failed_hover_dx_m: -6.0
  b_failed_hover_dy_m: 0.0
  b_targets:
    # shift_y=-5，因此配置 y=70 → 生成后的任务坐标 y=65。
    - {x: 10.0, y: 70.0}
    - {x: 0.0, y: 70.0}
  slot_replacements: {}
  expected_faulted_uavs: [UAV10, UAV11]
  expected_spare_uavs: [UAV13, UAV14]

calibration:
  preferred_rows:
    - [UAV6, UAV8, UAV9]
  min_compute_uavs: 3
  sample_window_s: 8.0

geometry:
  min_pairwise_m: 5.0
  min_b_a_strike_3d_m: 4.0
  min_b_a_vertical_m: 5.0
  min_fault_b_horizontal_m: 4.0
  min_fault_formation_vertical_m: 3.0
  min_prepare_batch_clearance_m: 5.0
  min_move_to_displacement_m: 0.5
  target_pose_max_age_s: 3.0
  target_horizontal_tolerance_m: 2.0
  target_vertical_tolerance_m: 1.0

scheduler:
  horizontal_speed_mps: 0.7
  geometric_distance_m: 1.3
  safety_margin_m: 1.0
  time_epsilon_s: 1.0e-6
  max_start_delay_s: 30.0
  max_interval_combinations: 2000
  max_compute_time_s: 5.0
  timeout_slack_s: 2.0
