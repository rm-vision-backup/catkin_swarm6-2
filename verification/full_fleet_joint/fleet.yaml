# 14–16 架 A/B 联合任务参数源。
# 任务坐标：右 x / 前 y / 上 z；原点=标定计算集所在排的中心机位。
# 所有 y 值都是“名义原点（UAV8 机位）为 0”的候选值；生成器按实际标定排自动平移。

schema_version: "1.0"

grid:
  # 现场四排五列、5m 网格；第一排最前（任务 +y）。
  columns_m: [-10.0, -5.0, 0.0, 5.0, 10.0]
  row_y_m: [5.0, 0.0, -5.0, -10.0]
  row_uavs:
    - [UAV1, UAV2, UAV3, UAV4, UAV5]
    - [UAV6, UAV7, UAV8, UAV9, UAV10]
    - [UAV11, UAV12, UAV13, UAV14, UAV15]
    - [UAV16]

field:
  # 任务空域候选；现场实测后替换。地面机位/起降区单独按净空核对。
  min_x: -50.0
  max_x: 50.0
  min_y: -15.0
  max_y: 140.0
  safety_margin_m: 5.0

mission:
  b_count: 4
  # 可选：显式指定 B 组（UAVn 列表）。留空 = 自动从“编队+备用机”之外的剩余机中选。
  b_uavs: []
  # 第 b_failed_index 架（0-based，按 b_ids 排序）首次打击失败；第 4 架补打。
  # 失败机不返回起点，而是在目标附近 5m 层悬停（默认目标 -6m 侧向）。
  b_failed_index: 1
  b_failed_hover_dx_m: -6.0
  b_failed_hover_dy_m: 0.0
  # 可选：地面槽位替换 {槽位UAV: 实际UAV}。用于某架故障时由另一架顶替其
  # 地面机位；生成时用 --replace UAV13=UAV16。留空表示不替换。
  slot_replacements: {}
  # left = 地面第 1–3 排、第 1–3 列；right = 第 1–3 排、第 3–5 列。
  formation_block: left
  formation_survivors: 9
  prepare_forward_m: 1.0          # 编队机从地面原位前移 1m，避免零水平位移
  spare_hold_alt_m: 5.0           # 备用机起飞后原地 5m 待命，故障后再飞过去
  segment_length_m: 60.0          # 每航带沿前向 60m
  coverage_strips: 4              # 初始 1 条 + 重构后 3 条（boustrophedon）
  coverage_lateral_step_m: 12.0   # 航带横向步距（3×3 扫描带宽 18m，重叠 6m）
  scan_band_m: 8.0
  coverage_alt_m: 12.0
  fault_exit_alt_m: 8.0
  fault_exit_dx_m: 20.0           # 损毁机从边缘列向外侧退出 20m
  fault_exit_dy_m: 0.0
  b_transit_alt_m: 8.0
  b_strike_alt_m: 5.0
  b_start_alt_m: 5.0
  # 3 个目标，均在侦查覆盖区内（航带 1/2/3）；z 由 world.json 固定为 0。
  b_targets:
    - {x: -8.0, y: 50.0}
    - {x: 10.0, y: 80.0}
    - {x: 24.0, y: 80.0}

calibration:
  # 计算集必须关于排中心对称；优先第 2 排，其次第 3 排、第 1 排。
  preferred_rows:
    - [UAV6, UAV7, UAV8, UAV9, UAV10]
    - [UAV11, UAV12, UAV13, UAV14, UAV15]
    - [UAV1, UAV2, UAV3, UAV4, UAV5]
  min_compute_uavs: 3
  sample_window_s: 8.0

geometry:
  min_pairwise_m: 5.0
  # B 转场在 8m、A 在 12m；B 目标在侦查航带内，用 3D 间隔而不是纯水平间隔。
  min_b_a_strike_3d_m: 4.0
  min_b_a_vertical_m: 5.0
  min_fault_b_horizontal_m: 4.0
  min_fault_formation_vertical_m: 3.0
  min_prepare_batch_clearance_m: 5.0
  min_move_to_displacement_m: 0.5
  target_pose_max_age_s: 3.0
  target_horizontal_tolerance_m: 2.0
  target_vertical_tolerance_m: 1.0

# 离线 scheduler 预跑参数，取自 src/tcp_to_ros/config/backend_defaults.yaml。
scheduler:
  horizontal_speed_mps: 0.7
  geometric_distance_m: 1.3
  safety_margin_m: 1.0
  time_epsilon_s: 1.0e-6
  max_start_delay_s: 30.0
  max_interval_combinations: 2000
  max_compute_time_s: 5.0
  timeout_slack_s: 2.0
